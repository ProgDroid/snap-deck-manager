[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "^4"
actix-web-lab = { version = "^0.23", features = ["spa"] }
anyhow = "^1"
base64 = "^0.22"
common = { path = "../common" }
config-file = "^0.2"
env_logger = "0.11"
log = "^0.4"
reqwest = { version = "^0.12", features = ["json"] }
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
serde-aux = "^4.5"
strum = { version = "^0.26", features = ["derive"] }
strum_macros = "^0.26"
surrealdb = "^2"
uuid = { version = "^1", features = ["v4"] }
